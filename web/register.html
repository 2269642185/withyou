<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>朋友邀请 · 与你纪念日</title>
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#fff9f2;color:#49382f;font:17px/1.8 system-ui,sans-serif}main{max-width:520px;margin:10vh auto;padding:28px}h1{font-size:30px;line-height:1.4}a{color:inherit}a.primary{display:block;text-align:center;background:#775742;color:#fff9f2;text-decoration:none;padding:13px 18px;border-radius:16px;margin:24px 0}a[hidden]{display:none}small{color:#846f62}p{overflow-wrap:anywhere}@media(prefers-color-scheme:dark){body{background:#231f1c;color:#f2e5d7}small{color:#c2ac99}}</style></head>
<body><main><small>与你 · 纪念日</small><h1>把日常，分享给在意的人</h1><p id="message">正在检查朋友邀请…</p><a id="open" class="primary" hidden>打开 App，继续注册</a><p>还没有安装？先前往<a href="./" rel="noreferrer">下载页</a>安装最新版，再回到本页面打开邀请。</p><small>注册链接 72 小时内有效，仅供一位新朋友使用。注册不会自动配对，双方确认成为伙伴后才开始共享。邀请是否有效以 App 内服务器验证为准。</small></main>
<script>function updateInvite(){const raw=new URLSearchParams(location.hash.slice(1)).get('invite')||'';const valid=/^[a-f0-9]{32}$/.test(raw);document.getElementById('message').textContent=valid?'朋友邀请你一起记录重要日子，分享每天的小进步。':'邀请链接不完整，请向朋友获取新的注册链接。';const a=document.getElementById('open');a.hidden=!valid;if(valid){a.href='withyou://register?invite='+raw;}else{a.removeAttribute('href');}}window.addEventListener('hashchange',updateInvite);updateInvite();</script></body></html>
